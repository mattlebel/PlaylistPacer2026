# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render creates the database and prompts for the `sync: false` values.
databases:
  - name: playlist-pacer-db
    plan: free # free Postgres expires after 30 days; upgrade to keep notes long-term
    databaseName: playlistpacer
    user: playlistpacer

services:
  - type: web
    name: playlist-pacer
    runtime: node
    plan: free # free instances sleep when idle; first visit after a nap takes ~30-60s
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: playlist-pacer-db
          property: connectionString
      # Spotify app (developer.spotify.com/dashboard). The client ID is baked in at build time.
      - key: NEXT_PUBLIC_SPOTIFY_CLIENT_ID
        sync: false
      # Lets friends search songs without logging in to Spotify.
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional: confirmation emails with edit links (resend.com).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: set if you add a custom domain. Defaults to Render's onrender.com URL.
      - key: APP_URL
        sync: false
